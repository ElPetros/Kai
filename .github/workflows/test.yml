name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Verify Java version
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version

      - name: Check Kotlin and Gradle formatting
        run: ./gradlew spotlessCheck --no-daemon --stacktrace

      # Paparazzi baselines are intentionally gitignored in this project.
      # Run the screenshot tests in record mode to exercise rendering without
      # claiming a visual-regression comparison against committed golden images.
      - name: Run screenshot rendering tests (no baseline comparison)
        run: ./gradlew :screenshotTests:recordPaparazziDebug --no-daemon --stacktrace

      - name: Verify site images are converted
        shell: bash
        run: |
          set -euo pipefail
          unconverted=$(find site/img -maxdepth 1 -type f -name '*.png' ! -name 'og-preview.png' ! -name 'preview.png' -print)
          if [[ -n "$unconverted" ]]; then
            echo "::error::Unconverted site images found. Run ./scripts/convert-site-images-to-webp.sh locally, review the changes, and commit them."
            printf '%s\n' "$unconverted"
            exit 1
          fi

      - name: Run desktop tests
        run: ./gradlew :composeApp:desktopTest --no-daemon --stacktrace
