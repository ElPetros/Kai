name: Speech Benchmark Core Tests

on:
  pull_request:
    branches:
      - feature/offline-speech-input
    paths:
      - "composeApp/src/commonTest/kotlin/com/inspiredandroid/kai/speechbenchmark/**"
      - "composeApp/build.gradle.kts"
      - "build.gradle.kts"
      - "gradle/libs.versions.toml"
  workflow_dispatch:

concurrency:
  group: speech-benchmark-core-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark-core:
    name: Verify benchmark scoring core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Check formatting and run shared benchmark tests
        run: ./gradlew spotlessCheck :composeApp:desktopTest --no-daemon --stacktrace
